name: GitHub Pages
on:
  push:
    branches:
      - main

# Workflow-level permissions: allow the GITHUB_TOKEN to create Pages deployments and sign tokens
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Install & build site
        # Replace these commands with your real build commands for the project.
        # Ensure the build outputs static files to ./public (or change publish_dir below).
        run: |
          npm ci
          npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v1
        with:
          path: ./public   # <-- change to your actual build output (e.g. ./dist) if needed

      - name: Deploy to GitHub Pages
        id: deploy_pages
        uses: actions/deploy-pages@v1

      - name: Fallback — deploy to gh-pages branch
        if: steps.deploy_pages.outcome != 'success'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
